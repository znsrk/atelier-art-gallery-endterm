name: Check website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Check all pages and interactions
        run: python tests/check.py
